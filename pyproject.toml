[project]
name = "mr-mol"
version = "0.1.0"
description = "Multi-Granular Rationale-Guided Molecular LLM for Property Prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data processing
    "datasets>=4.4.2",
    "deepchem>=2.8.0",
    "huggingface-hub>=0.26.0,<1.0",
    "pandas>=2.3.3",
    "pyarrow>=17.0.0",
    "rdkit>=2025.9.3",
    "selfies>=2.2.0",
    "tqdm>=4.67.1",
    # Deep learning
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.29.0",
    # Graph neural networks (model + Mole-BERT rationale source)
    "torch-geometric>=2.6.0",
    "ogb>=1.3.6",
    "networkx>=3.0",
    # Evaluation
    "scikit-learn>=1.6.0",
    "nltk>=3.9.0",
    "rouge-score>=0.1.2",
    # Config & logging
    "pyyaml>=6.0",
    "tensorboard>=2.18.0",
    # Utilities
    "einops>=0.8.0",
    "tdc>=0.1",
    "astartes[molecules]>=1.3.3",
    "pytdc>=0.3.6",
    "salesforce-lavis>=1.0.0",
    "torchvision>=0.26.0",
    "numpy<2",
]

[tool.uv]
extra-build-dependencies = { torch-scatter = ["torch"], torch-sparse = ["torch"] }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
