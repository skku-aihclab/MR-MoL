# Stage 1: Graph-Text Alignment.

model:
  llm_name: "meta-llama/Llama-3.1-8B-Instruct"
  graph_dim: 300
  llm_dim: 4096
  num_query_tokens: 8
  molca_ckpt_path: "./checkpoints/molca/stage1.ckpt"
  dropout: 0.1
  use_lora: false
  freeze_graph_encoder: false
  freeze_projector: false

training:
  epochs: 20
  learning_rate: 1.0e-4       # llm projector layer
  qformer_lr: 5.0e-5          # Q-Former
  graph_encoder_lr: 1.0e-5    # GNN
  weight_decay: 0.01
  batch_size: 2
  gradient_accumulation_steps: 32
  warmup_ratio: 0.1
  max_length: 1024
  max_grad_norm: 1.0

data:
  train_path: "./data_prep/stage1/train.json"
  num_workers: 4

checkpointing:
  save_dir: "./checkpoints/trained/stage1"
  save_every_epoch: true

hardware:
  device: "cuda"
  seed: 42  # use seeds: 42, 43, 44
